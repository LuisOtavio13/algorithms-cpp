name: Continuous Integration Developer macOS

on: push

jobs:
  test:
    runs-on: macos-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: create foolder
        run: mkdir out 

      - name: compile Cmake
        run: cmake ..
        working-directory: ./out

      - name: Build
        run: cmake --build . --config Debug
        working-directory: ./out

      - name: Test
        run: ctest -C Debug  
        working-directory: ./out
